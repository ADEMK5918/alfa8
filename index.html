<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dijital Hatıra - 19 Eylül 2016</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  /* Reset */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: #121212;
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
    text-align: center;
  }

  h1 {
    font-weight: 600;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }

  p {
    font-weight: 400;
    font-size: 1.1rem;
    max-width: 500px;
    color: #bbb;
    margin-bottom: 2rem;
    line-height: 1.5;
  }

  strong {
    font-weight: 600;
  }

  #countup {
    font-family: 'Courier New', monospace;
    font-size: 2.8rem;
    font-weight: 600;
    color: #90caf9;
    background: rgba(255, 255, 255, 0.05);
    padding: 0.7rem 2rem;
    border-radius: 8px;
    user-select: none;
  }

  footer {
    margin-top: auto;
    font-size: 0.9rem;
    color: #666;
    padding-top: 1.5rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    h1 {
      font-size: 2rem;
    }

    p {
      font-size: 1rem;
      max-width: 90vw;
    }

    #countup {
      font-size: 2rem;
      padding: 0.6rem 1.5rem;
    }
  }
</style>
</head>
<body>

  <h1>Dijital Hatıra</h1>
  <p>
    <strong>Tarih:</strong> 19 Eylül 2016<br />
    <strong>Bugüne kadar geçen süre:</strong>
  </p>

  <div id="countup">Yükleniyor...</div>

  <footer>© 2025 by Adem Kaya</footer>

<script>
  const startDate = new Date('2016-09-19T00:00:00');

  function pad(num) {
    return num.toString().padStart(2, '0');
  }

  function updateCountUp() {
    const now = new Date();
    let diff = Math.floor((now - startDate) / 1000);

    const days = Math.floor(diff / (3600 * 24));
    diff -= days * 3600 * 24;

    const hours = Math.floor(diff / 3600);
    diff -= hours * 3600;

    const minutes = Math.floor(diff / 60);
    const seconds = diff - minutes * 60;

    document.getElementById('countup').textContent = 
      `${days} gün ${pad(hours)} saat ${pad(minutes)} dakika ${pad(seconds)} saniye`;
  }

  updateCountUp();
  setInterval(updateCountUp, 1000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mersin Üniversitesi 2. El Pazarı</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding:  0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #222;
    }

    header {
      background-color: #00796B;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-icon {
      font-size: 24px;
      cursor: pointer;
      display: none;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background-color: #004D40;
      color: white;
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 999;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar a {
      display: block;
      margin: 20px 0;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .main-container {
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .auth-container {
      background-color: white;
      padding: 30px;
      max-width: 400px;
      margin: 0 auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #00796B;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .chat-page, .market-page {
      display: none;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <a href="#" onclick="showPage('market')">Eşya Satışı</a>
    <a href="#" onclick="showPage('market')">Güncel Satılık Eşyalar</a>
  </div>

  <header>
    <div class="menu-icon" id="menuIcon" onclick="toggleSidebar()">☰</div>
    <h2>Mersin Üniversitesi 2. El & Sıfır Satış Pazarı</h2>
  </header>

  <div class="main-container">
    <div class="auth-container" id="registerForm">
      <h1>Kayıt Ol</h1>
      <input type="email" id="registerUsername" placeholder="E-posta" required>
      <input type="password" id="registerPassword" placeholder="Şifre" required>
      <button onclick="register()">Kayıt Ol</button>
      <p style="margin-top:10px">Zaten hesabınız var mı? <a href="#" onclick="showLogin()">Giriş Yap</a></p>
    </div>

    <div class="auth-container hidden" id="loginForm">
      <h1>Giriş Yap</h1>
      <input type="email" id="loginUsername" placeholder="E-posta" required>
      <input type="password" id="loginPassword" placeholder="Şifre" required>
      <button onclick="login()">Giriş Yap</button>
    </div>

    <div class="chat-page" id="chatPage">
      <h1>Hoşgeldin! Artık chatleşebilir, eşya alım-satımı yapabilirsin!</h1>
    </div>

    <div class="market-page" id="marketPage">
      <h2>Satış Alanı</h2>
      <p>Burada eşya ekleme ve güncel ilanları görme özellikleri gelecektir.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAmHo4HZrdyf1DLlnoAqUyo9M6sVWhvxk",
      authDomain: "alfa7-devam.firebaseapp.com",
      databaseURL: "https://alfa7-devam-default-rtdb.firebaseio.com",
      projectId: "alfa7-devam",
      storageBucket: "alfa7-devam.firebasestorage.app",
      messagingSenderId: "764460755142",
      appId: "1:764460755142:web:4881db4d663d2fb1428fc7",
      measurementId: "G-W5EFB10NE9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.toggleSidebar = function () {
      document.getElementById('sidebar').classList.toggle('active');
    }

    window.showLogin = function () {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    }

    window.register = async function () {
      const email = document.getElementById('registerUsername').value;
      const password = document.getElementById('registerPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('Kayıt başarılı! Giriş yapabilirsiniz.');
        showLogin();
      } catch (error) {
        alert(error.message);
      }
    }

    window.login = async function () {
      const email = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('chatPage').style.display = 'block';
        document.getElementById('menuIcon').style.display = 'block';
      } catch (error) {
        alert('Giriş başarısız: ' + error.message);
      }
    }

    window.showPage = function (page) {
      document.getElementById('chatPage').style.display = 'none';
      document.getElementById('marketPage').style.display = 'none';

      if (page === 'market') {
        document.getElementById('marketPage').style.display = 'block';
      }
    }
  </script>
</body>
</html>
